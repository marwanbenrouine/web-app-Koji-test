name: KOJI - AI evaluations (offline)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Tests hors ligne (sans API ni base)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run test:ai-evals
      - run: npm run test:ai-smoke
      - run: npm run eval:ai -- --suite smoke
